[package]
name = "vxsym"
version = "0.1.0"
edition = "2021"
description = "VxWorks firmware symbol-table parser"
readme = "README.md"

[[bin]]
name = "vxsym"
path = "src/main.rs"

[lib]
name = "vxsym"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
